module_name: "Terraform VPN Module"
module_description: The Terraform Wrapper for Site-to-Site VPN simplifies AWS networking integration (Customer Gateway / Virtual Private Gateway or Transit Gateway attachment / VPN connection / static routes / optional TGW static routes / VPC route propagation where VGW is used / tunnel options / etc.) alongside the VPC and TGW wrappers.
module_badges:
  - url: "https://github.com/gocloudLa/terraform-aws-wrapper-vpn/releases/latest"
    image: "https://img.shields.io/github/v/release/gocloudLa/terraform-aws-wrapper-vpn.svg?style=for-the-badge"
    alt: "Latest Release"
  - url: ""
    image: "https://img.shields.io/github/last-commit/gocloudLa/terraform-aws-wrapper-vpn.svg?style=for-the-badge"
    alt: "Last Commit"
  - url: "https://registry.terraform.io/modules/gocloudLa/wrapper-vpn/aws"
